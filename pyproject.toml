[project]
name = "itg-rag"
version = "0.1.0"
description = "Grounded answers over local documents with Weaviate"
readme = "README.md"
authors = [
    { name = "imiderji", email = "skishou.developer@yandex.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=2,<4",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "weaviate-client>=4.16,<5",
]

[project.scripts]
itg-rag = "itg_rag.main:main"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
markers = ["integration: requires a real local Weaviate server"]

[tool.ruff]
line-length = 79
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["itg_rag"]

[dependency-groups]
dev = [
    "httpx2>=2.16,<3",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]
